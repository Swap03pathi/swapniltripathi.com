<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <!-- Title, description, OG/Twitter, canonical, JSON-LD are injected PER ROUTE by the
         <Seo> component and baked into each prerendered page. Static copies here would
         duplicate tags in every page, so every route must render <Seo>. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Swapnil" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- AdSense script removed for performance while the account is unapproved:
         it loaded ~70KB serving zero ads. ads.txt carries site verification;
         ads return route-scoped via <AdSlot> after approval. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
